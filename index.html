<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mas Motret Calculator</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden border border-gray-200">

    <!-- Header -->
    <div class="bg-gray-900 px-8 py-8 text-center relative">
      <div class="absolute top-0 left-0 w-full h-1 bg-orange-500"></div>

      <h1 class="text-3xl font-bold text-white mb-2">
        📸 Mas Motret
      </h1>

      <p class="text-gray-400 text-sm">
        Estimasi Biaya Layanan Fotografi
      </p>
    </div>

    <!-- Content -->
    <div class="p-8">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Jenis Foto -->
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">
            Jenis Foto
          </label>

          <select id="jenisFoto"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500">
            <option value="">Pilih Jenis Foto...</option>
          </select>
        </div>

        <!-- Jumlah Orang -->
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">
            Jumlah Orang
          </label>

          <select id="jumlahOrang"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500">
            <option value="">Pilih Jumlah Orang...</option>
          </select>
        </div>

        <!-- Durasi -->
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">
            Durasi
          </label>

          <select id="durasi"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500">
            <option value="">Pilih Durasi...</option>
          </select>
        </div>

        <!-- Cetak -->
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">
            Pilihan Cetak
          </label>

          <select id="cetak"
            class="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500">
            <option value="">Pilih Paket Cetak...</option>
          </select>
        </div>

      </div>

      <!-- Total -->
      <div class="mt-10 bg-orange-50 border-2 border-orange-100 rounded-2xl p-6 flex flex-col md:flex-row items-center justify-between gap-4">

        <div>
          <p class="text-sm uppercase tracking-wide text-orange-700 font-semibold">
            Estimasi Total Harga
          </p>

          <h2 id="totalHarga"
            class="text-4xl font-black text-gray-900 mt-1">
            Rp0
          </h2>

          <p class="text-xs text-orange-600 mt-2">
            *Harga dapat berubah sesuai kesepakatan final
          </p>
        </div>

        <button id="btnWA"
          class="bg-orange-500 hover:bg-orange-600 text-white font-bold px-8 py-4 rounded-xl transition-all w-full md:w-auto">
          Pesan via WhatsApp
        </button>

      </div>

    </div>

  </div>

  <script>
    const DATA_HARGA = {
      jenisFoto: [
        { id: 'wedding', label: 'Wedding', price: 700000 },
        { id: 'khitanan', label: 'Khitanan', price: 400000 },
        { id: 'aqiqah', label: 'Aqiqah', price: 400000 },
        { id: 'studio', label: 'Studio', price: 20000 },
      ],

      jumlahOrang: [
        { id: '2', label: '2 Orang', price: 10000 },
        { id: '3', label: '3 Orang', price: 25000 },
        { id: '4', label: '4 Orang', price: 35000 },
        { id: '5', label: '5 Orang', price: 50000 },
        { id: '6-8', label: '6 - 8 Orang', price: 70000 },
        { id: '9-10', label: '9 - 10 Orang', price: 120000 },
      ],

      durasi: {
        studio: [
          { id: '15m', label: '15 Menit', price: 10000 },
          { id: '30m', label: '30 Menit', price: 25000 },
          { id: '60m', label: '60 Menit', price: 40000 },
        ],

        wedding: [
          { id: '8h', label: '8 Jam', price: 200000 },
          { id: '10h', label: '10 Jam', price: 350000 },
          { id: 'fullday', label: 'Full Day', price: 500000 },
        ],

        khitanan: [
          { id: '4h', label: '4 Jam', price: 50000 },
          { id: '8h', label: '8 Jam', price: 100000 },
          { id: 'fullday', label: 'Full Day', price: 200000 },
        ],

        aqiqah: [
          { id: '4h', label: '4 Jam', price: 50000 },
          { id: '8h', label: '8 Jam', price: 100000 },
          { id: 'fullday', label: 'Full Day', price: 200000 },
        ]
      },

      cetak: [
        { id: 'none', label: 'Tanpa Cetak', price: 0 },
        { id: '1r12r', label: '1 Roll + 12R', price: 200000 },
        { id: '2r16r', label: '2 Roll + 16R', price: 350000 },
        { id: '3r18r', label: '3 Roll + 18R', price: 400000 },
      ]
    };

    const jenisFoto = document.getElementById('jenisFoto');
    const jumlahOrang = document.getElementById('jumlahOrang');
    const durasi = document.getElementById('durasi');
    const cetak = document.getElementById('cetak');
    const totalHarga = document.getElementById('totalHarga');
    const btnWA = document.getElementById('btnWA');

    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
      }).format(angka);
    }

    function isiSelect(select, data) {
      data.forEach(item => {
        const option = document.createElement('option');

        option.value = item.id;
        option.textContent =
          `${item.label} (+ ${formatRupiah(item.price)})`;

        select.appendChild(option);
      });
    }

    isiSelect(jenisFoto, DATA_HARGA.jenisFoto);
    isiSelect(jumlahOrang, DATA_HARGA.jumlahOrang);
    isiSelect(cetak, DATA_HARGA.cetak);

    function updateDurasi() {
      durasi.innerHTML =
        '<option value="">Pilih Durasi...</option>';

      const selectedJenis = jenisFoto.value;

      if (!selectedJenis) return;

      DATA_HARGA.durasi[selectedJenis].forEach(item => {
        const option = document.createElement('option');

        option.value = item.id;
        option.textContent =
          `${item.label} (+ ${formatRupiah(item.price)})`;

        durasi.appendChild(option);
      });
    }

    function hitungTotal() {
      let total = 0;

      const jenis =
        DATA_HARGA.jenisFoto.find(
          item => item.id === jenisFoto.value
        );

      const orang =
        DATA_HARGA.jumlahOrang.find(
          item => item.id === jumlahOrang.value
        );

      const cetakItem =
        DATA_HARGA.cetak.find(
          item => item.id === cetak.value
        );

      if (jenis) total += jenis.price;
      if (orang) total += orang.price;
      if (cetakItem) total += cetakItem.price;

      if (jenisFoto.value && durasi.value) {
        const durasiItem =
          DATA_HARGA.durasi[jenisFoto.value].find(
            item => item.id === durasi.value
          );

        if (durasiItem) total += durasiItem.price;
      }

      totalHarga.textContent = formatRupiah(total);
    }

    jenisFoto.addEventListener('change', () => {
      updateDurasi();
      hitungTotal();
    });

    jumlahOrang.addEventListener('change', hitungTotal);
    durasi.addEventListener('change', hitungTotal);
    cetak.addEventListener('change', hitungTotal);

    btnWA.addEventListener('click', () => {
      const total = totalHarga.textContent;

      if (total === 'Rp0') {
        alert('Silakan pilih paket terlebih dahulu.');
        return;
      }

      const text =
        `Halo Mas Motret! Saya ingin booking foto.%0A%0A` +
        `📸 Jenis Foto: ${jenisFoto.options[jenisFoto.selectedIndex].text}%0A` +
        `👥 Jumlah Orang: ${jumlahOrang.options[jumlahOrang.selectedIndex].text}%0A` +
        `⏱️ Durasi: ${durasi.options[durasi.selectedIndex]?.text || '-'}%0A` +
        `🖨️ Cetak: ${cetak.options[cetak.selectedIndex].text}%0A%0A` +
        `💰 Total: ${total}`;

      window.open(
        `https://wa.me/6281234567890?text=${text}`,
        '_blank'
      );
    });
  </script>

</body>
</html>
